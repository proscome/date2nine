<!doctype html>

<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>date2nine</title>

  <meta name="theme-color" content="#0ea5e9" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <style>

    /* ==========================================
       カラーテーマ
       ========================================== */

    :root {
      --fg: #0b132b;
      --muted: #6b7280;
      --bg: #f9fafb;
      --brand: #0ea5e9;
    }


    /* ==========================================
       ページ全体
       ========================================== */

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);

      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Helvetica,
        Arial,
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        "Noto Sans JP",
        sans-serif;
    }


    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }


    /* ==========================================
       ヘッダー
       ========================================== */

    header {
      padding: 20px 16px 8px;
      text-align: center;
    }


    h1 {
      margin: 0;
      font-size: 28px;
    }


    /* ==========================================
       メイン
       ========================================== */

    main {
      flex: 1;
      display: flex;
    }


    /* ==========================================
       カード
       ========================================== */

    .card {
      margin: 12px auto 24px;

      width: min(720px, calc(100% - 24px));

      background: #fff;

      border-radius: 16px;

      box-shadow:
        0 6px 24px rgba(2, 6, 23, .08);

      padding: 20px;

      padding-bottom: 68px;

      position: relative;

      box-sizing: border-box;
    }


    /* ==========================================
       ラベル
       ========================================== */

    label {
      display: block;

      font-size: 16px;

      color: var(--muted);

      margin-bottom: 6px;
    }


    /* ==========================================
       入力欄
       ========================================== */

    input[type="date"],
    input[type="text"] {

      width: 100%;
      max-width: 100%;
      min-width: 0;

      font-size: 24px;

      padding: 14px 16px;

      border: 1px solid #e5e7eb;

      border-radius: 12px;

      box-sizing: border-box;

      display: block;
    }


    /*
      iPhone / Safari用

      Safariのdate入力欄だけ右側に
      はみ出す現象を補正する。

      日付選択そのものの操作性は維持する。
    */

    @supports (-webkit-touch-callout: none) {

      input[type="date"] {

        width: calc(100% - 30px);

        max-width: calc(100% - 30px);

        min-width: 0;

        box-sizing: border-box;

        display: block;
      }
    }


    /* ==========================================
       出力
       ========================================== */

    .out {

      font-variant-numeric: tabular-nums;

      font-weight: 700;

      letter-spacing: .04em;
    }


    .big {
      font-size: 44px;
    }


    .mono {

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        "Courier New",
        monospace;
    }


    /* ==========================================
       ボタン
       ========================================== */

    button {

      appearance: none;

      border: 0;

      border-radius: 12px;

      padding: 14px 18px;

      font-size: 18px;

      width: 100%;

      box-sizing: border-box;

      cursor: pointer;
    }


    /* コピー */

    .btn {

      background: var(--brand);

      color: #fff;
    }


    .btn:active {

      transform: translateY(1px);
    }


    /* 共有 */

    .ghost {

      background: #eef6ff;

      color: #0369a1;
    }


    /* ホーム画面追加 */

    .install-btn {

      background: #f3f4f6;

      color: #374151;

      border: 1px solid #d1d5db;
    }


    /* ==========================================
       ボタン間隔
       ========================================== */

    .grid {

      display: grid;

      gap: 12px;
    }


    /* ==========================================
       PROSCOME
       ========================================== */

    .creator {

      position: absolute;

      right: 16px;

      bottom: 14px;

      display: flex;

      align-items: center;

      gap: 6px;

      color: #6b7280;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: .12em;

      opacity: .9;

      pointer-events: none;
    }


    .creator-icon {

      width: 24px;

      height: 24px;

      object-fit: contain;

      border-radius: 6px;
    }


    /* ==========================================
       メッセージ
       ========================================== */

    .toast {

      position: fixed;

      left: 12px;

      right: 12px;

      bottom: 12px;

      display: none;

      background: #111827;

      color: #fff;

      border-radius: 12px;

      padding: 12px 14px;

      font-size: 16px;

      text-align: center;

      cursor: pointer;

      z-index: 1000;
    }


    .toast.show {

      display: block;
    }

  </style>

</head>

<body>

  <div class="wrap">

<!-- ==========================================
     ヘッダー
     ========================================== -->

<header>

  <h1>date2nine</h1>

</header>


<!-- ==========================================
     メイン
     ========================================== -->

<main>

  <section class="card">


    <div class="grid">


      <!-- ==================================
           年月日
           ================================== -->

      <div>

        <label for="date">
          年月日を選択
        </label>

        <input
          id="date"
          type="date"
          inputmode="numeric"
        />

      </div>


      <!-- ==================================
           パスワード
           ================================== -->

      <div>

        <label>
          パスワード
        </label>

        <input
          id="final9"
          class="out big mono"
          type="text"
          readonly
          value="-"
        />

      </div>


      <!-- ==================================
           ボタン
           ================================== -->

      <div class="grid">


        <button
          id="copy"
          class="btn"
        >
          コピー
        </button>


        <button
          id="share"
          class="ghost"
        >
          共有
        </button>


        <button
          id="installHelp"
          class="install-btn"
        >
          ホーム画面に追加するには
        </button>


      </div>


    </div>


    <!-- ==================================
         PROSCOME
         ================================== -->

    <div class="creator">

      <img
        src="./icons/icon-192.png"
        alt=""
        class="creator-icon"
      />

      <span>
        PROSCOME
      </span>

    </div>


  </section>

</main>

  </div>

  <!-- ==========================================
       メッセージ
       ========================================== -->

  <div
    id="toast"
    class="toast"
  ></div>

  <script>


    /* ==========================================
       日付 → 8桁
       ========================================== */

    function yyyymmddDigits(dateStr) {

      if (!dateStr) {
        return null;
      }

      const s =
        dateStr.replaceAll('-', '');

      if (!/^\d{8}$/.test(s)) {
        return null;
      }

      return s
        .split('')
        .map(d => Number(d));
    }


    /* ==========================================
       各桁に1〜8を加算
       ========================================== */

    function addNoCarry(digits) {

      const base = [
        1, 2, 3, 4,
        5, 6, 7, 8
      ];

      return digits.map(
        (d, i) => (d + base[i]) % 10
      );
    }


    /* ==========================================
       桁の合計
       ========================================== */

    function sumDigits(digs) {

      return digs.reduce(
        (a, b) => a + b,
        0
      );
    }


    /* ==========================================
       最終9桁
       ========================================== */

    function compute(dateStr) {

      const y8 =
        yyyymmddDigits(dateStr);

      if (!y8) {
        return {
          final: null
        };
      }

      const s8 =
        addNoCarry(y8);

      const cd =
        sumDigits(s8) % 10;

      const final =
        s8.join('') + String(cd);

      return {
        final
      };
    }


    /* ==========================================
       DOM
       ========================================== */

    const elDate =
      document.getElementById('date');

    const elFinal =
      document.getElementById('final9');

    const elToast =
      document.getElementById('toast');

    const elInstallHelp =
      document.getElementById('installHelp');


    /* ==========================================
       結果表示
       ========================================== */

    function render(res) {

      if (!res || !res.final) {

        elFinal.value = '-';

        return;
      }

      elFinal.value =
        res.final;
    }


    /* ==========================================
       今日の日付
       ========================================== */

    function setToday() {

      const tzOffsetMs =
        new Date()
          .getTimezoneOffset() * 60000;

      const localISO =
        new Date(
          Date.now() - tzOffsetMs
        )
          .toISOString()
          .slice(0, 10);

      elDate.value =
        localISO;

      render(
        compute(localISO)
      );
    }


    /* ==========================================
       日付変更
       ========================================== */

    elDate.addEventListener(
      'change',
      () => {

        render(
          compute(elDate.value)
        );

      }
    );


    /* ==========================================
       コピー
       ========================================== */

    document
      .getElementById('copy')
      .addEventListener(
        'click',
        async () => {

          const txt =
            elFinal.value;

          if (!txt || txt === '-') {
            return;
          }

          try {

            await navigator
              .clipboard
              .writeText(txt);

            showToast(
              'パスワードをコピーしました'
            );

          } catch (e) {

            showToast(
              'コピーに失敗しました'
            );
          }

        }
      );


    /* ==========================================
       共有
       ========================================== */

    document
      .getElementById('share')
      .addEventListener(
        'click',
        async () => {

          const txt =
            elFinal.value;

          if (!txt || txt === '-') {
            return;
          }

          if (navigator.share) {

            try {

              await navigator.share({

                title: 'date2nine',

                text: txt

              });

            } catch (_) {}

          } else {

            showToast(
              '共有に非対応です'
            );
          }

        }
      );


    /* ==========================================
       PWAインストール
       ========================================== */

    let deferredPrompt = null;


    /*
      Chrome / Edge / Android
    */

    window.addEventListener(
      'beforeinstallprompt',
      (e) => {

        e.preventDefault();

        deferredPrompt = e;

      }
    );


    /*
      PWAとしてインストールされた
    */

    window.addEventListener(
      'appinstalled',
      () => {

        deferredPrompt = null;

        updateInstallButton();

      }
    );


    /* ==========================================
       PWAとして起動しているか判定
       ========================================== */

    function isInstalledPWA() {

      /*
        Android / Chrome / Edge
      */

      const standalone =
        window.matchMedia(
          '(display-mode: standalone)'
        ).matches;


      /*
        iPhone / iPad Safari
      */

      const iosStandalone =
        window.navigator.standalone === true;


      return (
        standalone ||
        iosStandalone
      );
    }


    /* ==========================================
       ホーム画面追加ボタン表示制御
       ========================================== */

    function updateInstallButton() {

      if (isInstalledPWA()) {

        /*
          すでにホーム画面から
          アプリとして起動している
        */

        elInstallHelp.style.display =
          'none';

      } else {

        /*
          通常のブラウザ表示
        */

        elInstallHelp.style.display =
          '';
      }
    }


    /* ==========================================
       ホーム画面追加ボタン
       ========================================== */

    elInstallHelp.addEventListener(
      'click',
      async () => {


        /*
          Android / Chrome / Edge

          ブラウザがPWAインストール
          を提供している場合
        */

        if (deferredPrompt) {

          deferredPrompt.prompt();

          try {

            await deferredPrompt.userChoice;

          } catch (_) {}

          deferredPrompt = null;

          updateInstallButton();

          return;
        }


        /*
          iPhone / iPad
        */

        const isIOS =
          /iphone|ipad|ipod/i.test(
            navigator.userAgent
          );


        if (isIOS) {

          showToast(
            'Safariの「共有」→「ホーム画面に追加」を選択してください'
          );

          return;
        }


        /*
          その他
        */

        showToast(
          'ブラウザのメニューから「インストール」または「ホーム画面に追加」を選択してください'
        );

      }
    );


    /* ==========================================
       メッセージ表示
       ========================================== */

    function showToast(msg) {

      elToast.textContent =
        msg;

      elToast.classList.add(
        'show'
      );
    }


    /* ==========================================
       メッセージをタップして消す
       ========================================== */

    elToast.addEventListener(
      'click',
      () => {

        elToast.classList.remove(
          'show'
        );

      }
    );


    /* ==========================================
       Service Worker
       ========================================== */

    if (
      'serviceWorker' in navigator
    ) {

      window.addEventListener(
        'load',
        () => {

          navigator.serviceWorker
            .register('./sw.js');

        }
      );

    }


    /* ==========================================
       初期化
       ========================================== */

    setToday();

    updateInstallButton();


  </script>

</body>
</html>
